name: ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::205950089606:role/GitHubActions-ML-Iris
          aws-region: eu-north-1
          role-session-name: GitHubActionsSession

      - name: Test AWS access
        run: aws sts get-caller-identity

      - name: Pull data with DVC
        run: dvc pull

      - name: Run DVC pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: dvc repro
      
      # - name: Build Docker images
      #   run:  docker build -t iris-ml .

      # - name: Login to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2
      #   id: login-ecr

      # - name: Tag Docker image
      #   run: docker tag iris-ml:latest 205950089606.dkr.ecr.eu-north-1.amazonaws.com/iris-ml:latest

      # - name: Push image to ECR
      #   run: docker push 205950089606.dkr.ecr.eu-north-1.amazonaws.com/iris-ml:latest

  build-and-publish:

    needs: ml-pipeline

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::205950089606:role/GitHubActions-ML-Iris
          aws-region: eu-north-1
          role-session-name: GitHubActionsSession

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Login to doker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: docker meta
      #   uses: docker/metadata-action@v6
      #   id: meta
      #   with:
      #     images: 205950089606.dkr.ecr.eu-north-1.amazonaws.com/iris-ml

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            205950089606.dkr.ecr.eu-north-1.amazonaws.com/iris-ml:latest
            ${{ secrets.DOCKER_USERNAME }}/iris-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max